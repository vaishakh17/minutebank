<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MinuteBank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>⏳ MinuteBank</h1>
	<button id="logoutBtn" class="secondary">Logout</button>
    <p class="tagline">You get 1,440 minutes every day. Spend them wisely.</p>

    <label for="datePicker">Date</label>
    <input type="date" id="datePicker">

    <section id="balanceCard" class="card">
      <p>Balance (minutes)</p>
      <h2 id="balance">1440</h2>
      <p id="spentText">Spent: 0 min</p>
      <p id="overdraftMsg" class="hidden">⚠️ Overdraft! You planned more than 24 hours.</p>
    </section>

    <section class="card">
      <h3>Spend time</h3>
      <input type="text" id="title" placeholder="What did you do?">
      <select id="category">
        <option>Study</option>
        <option>Sleep</option>
        <option>Work</option>
        <option>Phone</option>
        <option>Exercise</option>
        <option>Family</option>
        <option>Other</option>
      </select>
      <input type="number" id="minutes" placeholder="Minutes" min="1">
      <button id="addBtn">Add</button>
      <p id="error" class="error"></p>
    </section>
	
	<section class="card">
	  <h3>This week</h3>
	  <p id="weekRange"></p>
	  <div id="weekBars"></div>
	  <p id="weekInsights"></p>
	</section>
	
    <section class="card">
      <h3>Entries</h3>
      <ul id="entryList"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
